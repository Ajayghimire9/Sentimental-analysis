[project]
name = "sentinel-nlp-platform"
version = "3.0.0"
description = "SentinelNLP: production-style sentiment intelligence platform with classical NLP, transformer benchmarking, MLOps, observability, and Kubernetes deployment"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "datasets>=2.20,<4",
  "mlflow>=2.16,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "prometheus-client>=0.21,<1",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
transformer = ["transformers>=4.45,<5", "torch>=2.4,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
